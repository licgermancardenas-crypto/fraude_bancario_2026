project:
  name: fraude_bancario_2026
  seed: 42
  client: "Banco Regional del Sur (BRS)"

data:
  scale_factor: 0.5
  time_window_days: 365  # 1 year — ~400K txns at scale 0.5 (matches published deliverables)
  raw_dir: data/raw
  processed_dir: data/processed
  workers: 4

features:
  node_features:
    - degree_in
    - degree_out
    - total_sent
    - total_received
    - avg_sent
    - avg_received
    - unique_counterparts
    - balance
    - risk_score

model:
  graphsage:
    hidden_channels: 64
    num_layers: 2
    dropout: 0.3
    lr: 0.005
    weight_decay: 0.0005
    epochs: 200
    patience: 20
    batch_size: null  # null = full-batch (para scale 0.01)

  gat:
    hidden_channels: 64
    num_layers: 2
    heads: 4
    dropout: 0.3
    lr: 0.005
    weight_decay: 0.0005
    epochs: 100  # 300 took ~30min at half this graph size; still ample for early stopping
    patience: 20

  node2vec:
    embedding_dim: 64
    walk_length: 30
    context_size: 10
    walks_per_node: 15
    p: 1.0
    q: 0.5          # < 1 → DFS, explora comunidades (anillos de lavado)
    w2v_epochs: 10
    w2v_workers: 1

  baseline:
    logreg:
      class_weight: balanced
      max_iter: 1000
    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.05

split:
  train: 0.70
  val: 0.15
  test: 0.15

paths:
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures
  dashboard_data_dir: dashboard/public/data

dashboard:
  top_rings: 10
  top_accounts: 200
  max_json_mb: 2

# Motor de reglas AML determinista (corre en paralelo al GNN).
# Umbrales calibrados sobre la distribución legítima del dataset sintético
# (legítimo P95: monto ~3.3K, avg_sent ~800, degree ~9).
rules:
  high_amount:              # R02: transferencia individual atípica (segmentado)
    personal: 15000         # legit personal P95 ~3.3K
    business: 50000         # las empresas pagan proveedores hasta ~$36K (P99)
    merchant: 50000
  conduit_symmetry: 0.15    # R01: |entrada-salida|/total por debajo de esto = conducto
  conduit_retention: 1.0    # R01: saldo/entradas por debajo de esto = no retiene
  conduit_min_flow: 5000    # R01: flujo mínimo para considerar la cuenta activa
  rapid_out_ratio: 0.50     # R03: fracción de entradas reenviadas en <24h
  rapid_symmetry: 0.25      # R03: además debe pasar el dinero (baja simetría)
  dormant_days: 1095        # R04: antigüedad mínima (3 años) para "durmiente"
  dormant_active_days: 10   # R04: días activos máximos
  dormant_min_amount: 12000 # R04: monto de la ráfaga de reactivación
  fanin_min_flow: 10000     # R05: flujo recibido mínimo (evita legítimas activas)
  fanout_avg_max: 4000      # R06: monto promedio máximo por chunk
  fanout_min_total: 15000   # R06: total distribuido mínimo (chunks chicos que suman alto)
  # Umbrales SEGMENTADOS por tipo de cuenta (KYC segmentation): para R05/R06/R07
  # las empresas y comercios tienen umbrales mucho más altos porque el fan-in de
  # clientes, la nómina y el alto volumen son comportamiento comercial esperable.
  fanin_degree:             # R05: grado de entrada mínimo
    personal: 12
    business: 40
    merchant: 70            # el fan-in de clientes es la operatoria normal de un comercio
  fanout_degree:            # R06: grado de salida mínimo
    personal: 12
    business: 45            # la nómina es fan-out esperable
    merchant: 40
  agg_volume:               # R07: volumen agregado (entrada+salida) atípico
    personal: 50000         # legit personal P95 ~8K
    business: 500000
    merchant: 500000
  severity_points:          # aporte al rule_score (0-100) por severidad
    alta: 40
    media: 25
    baja: 15
