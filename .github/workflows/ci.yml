name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Tests Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install pandas numpy scikit-learn networkx pyyaml pytest
      - name: Correr tests
        run: python -m pytest tests/ -q

  frontend:
    name: Dashboard (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Tests (vitest)
        run: npm run test
      - name: Build (next)
        run: npm run build
